[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "openapply-agent"
version = "0.1.0"
description = "Local-first AI job search & application agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-google-genai>=1.0",
    "langchain-openai>=0.1",
    "browser-use>=0.1",
    "playwright>=1.40",
    "seleniumbase>=4.20",
    "reportlab>=4.0",
    "streamlit>=1.35",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pypdf2>=3.0",
    "pydantic>=2.0",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
